<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>招生报名</title>
</head>
<body><div class="container">
    <h1>招生报名</h1>
    <label for="name">姓名:</label>
    <input type="text" id="name">
    <span id="nameError"></span>
    <br>
    <label for="direction">报名方向:</label>
    <select id="direction">
        <option value="">请选择方向:</option>
        <option value="frontend">前端开发</option>
        <option value="backend">后端开发</option>
    </select>
    <span id="directionError"></span>
    <br>
    <label for="introduction">自我介绍</label>
    <textarea id="introduction" maxlength="100"></textarea>
    <span id="introductionError"></span>
    <div>字数:<span id="count">0</span>/100</div>
    <div>
       <input type="checkbox" id="agreement">
       <label for="agreement">我已阅读并同意报名须知</label>
       <span id="agreementError"></span>
    </div>
    <button id="submission">提交报名</button>
    <button id="reset">重置</button></div>
    <script src="script.js"></script>
</body>
</html>
